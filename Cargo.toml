[package]
name = "rust-fhir"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
parking_lot = "0.12"
tracing = "0.1"
httpdate = "1.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
