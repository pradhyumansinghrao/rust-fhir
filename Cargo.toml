[package]
name = "rust-fhir"
version = "0.1.0"
edition = "2024"
description = "A high-performance HL7 FHIR R4 RESTful server and library written in Rust"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pradhyumansinghrao/rust-fhir"
keywords = ["fhir", "hl7", "healthcare", "rest", "axum"]
categories = ["web-programming::http-server", "database"]


[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
parking_lot = "0.12"
tracing = "0.1"
httpdate = "1.0"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
